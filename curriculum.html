<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Manager - Curriculum</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* Schedule specific styles */
        .schedule-grid-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding-bottom: 8px;
            margin-bottom: 8px;
            width: 100%;
            position: relative;
        }
        .schedule-grid-wrapper::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .schedule-grid-wrapper::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }
        .schedule-grid-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
            border: 1px solid var(--bg);
        }
        .schedule-grid-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        .schedule-grid-wrapper {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg);
        }
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            min-width: 700px;
            width: 100%;
        }
        .schedule-sidebar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        @media (max-width: 768px) {
            .schedule-grid {
                min-width: 550px;
                padding: 4px;
                gap: 3px;
            }
            .schedule-sidebar {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
        @media (max-width: 480px) {
            .schedule-grid {
                min-width: 450px;
                padding: 3px;
                gap: 2px;
            }
        }
        /* Instructor calendar scroll */
        .instructor-calendar-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding-bottom: 8px;
            margin-bottom: 8px;
            width: 100%;
            position: relative;
        }
        .instructor-calendar-wrapper::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .instructor-calendar-wrapper::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }
        .instructor-calendar-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
            border: 1px solid var(--bg);
        }
        .instructor-calendar-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        .instructor-calendar-wrapper {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg);
        }
        .instructor-calendar-grid {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            gap: 2px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px;
            min-width: 700px;
            width: 100%;
        }
        @media (max-width: 768px) {
            .instructor-calendar-grid {
                min-width: 550px;
                padding: 4px;
                gap: 2px;
            }
        }
        @media (max-width: 480px) {
            .instructor-calendar-grid {
                min-width: 450px;
                padding: 3px;
                gap: 1px;
            }
        }
        .instructor-calendar-grid .header-cell {
            padding: 4px;
            font-weight: 600;
            color: var(--text-dim);
            font-size: 0.65rem;
            text-align: center;
            background: var(--panel-alt);
            border-radius: 4px;
        }
        .instructor-calendar-grid .time-cell {
            padding: 4px;
            font-size: 0.6rem;
            color: var(--text-dim);
            text-align: right;
        }
        .instructor-calendar-grid .class-cell {
            background: var(--accent-soft);
            border-radius: 4px;
            padding: 4px;
            font-size: 0.6rem;
            border-left: 3px solid var(--accent);
            cursor: pointer;
            transition: background 0.15s;
        }
        .instructor-calendar-grid .class-cell:hover {
            background: var(--accent-soft);
            opacity: 0.8;
        }
        .instructor-calendar-grid .class-cell .class-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .instructor-calendar-grid .class-cell .student-name {
            font-size: 0.5rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .instructor-calendar-grid .empty-cell {
            padding: 4px;
            opacity: 0.2;
            font-size: 0.5rem;
            color: var(--text-dim);
            text-align: center;
        }
        /* Class view */
        .class-view-discipline {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .class-view-discipline .discipline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .class-view-discipline .instructor-group {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }
        .class-view-discipline .instructor-group .instructor-name {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .class-view-discipline .instructor-group .class-group {
            background: var(--panel-alt);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }
        .class-view-discipline .instructor-group .class-group:last-child {
            margin-bottom: 0;
        }
        .class-view-discipline .instructor-group .class-group .class-time {
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .class-view-discipline .instructor-group .class-group .student-tag {
            background: var(--panel);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            display: inline-block;
            margin: 2px;
        }
        /* Discipline list */
        #discipline-list .list-header {
            display: grid;
            gap: 6px;
            padding: 8px 12px;
            background: var(--panel-alt);
            border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
            font-weight: 600;
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            min-width: 700px;
            grid-template-columns: 1.5fr 0.9fr 1.2fr 0.8fr 0.8fr 0.7fr 1fr;
        }
        #discipline-list .list-item {
            display: grid;
            gap: 6px;
            padding: 8px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: none;
            align-items: center;
            min-width: 700px;
            grid-template-columns: 1.5fr 0.9fr 1.2fr 0.8fr 0.8fr 0.7fr 1fr;
            font-size: 0.78rem;
            word-break: break-word;
        }
        #discipline-list .list-item:last-child {
            border-radius: 0 0 var(--radius) var(--radius);
        }
        #discipline-list .list-item .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        @media (max-width: 768px) {
            #discipline-list .list-header {
                min-width: 600px;
                font-size: 0.55rem;
                padding: 6px 8px;
                gap: 4px;
                grid-template-columns: 1.2fr 0.7fr 0.8fr 0.6fr 0.6fr 0.5fr 0.8fr;
            }
            #discipline-list .list-item {
                min-width: 600px;
                font-size: 0.65rem;
                padding: 6px 8px;
                gap: 4px;
                grid-template-columns: 1.2fr 0.7fr 0.8fr 0.6fr 0.6fr 0.5fr 0.8fr;
            }
        }
        @media (max-width: 480px) {
            #discipline-list .list-header {
                min-width: 500px;
                font-size: 0.5rem;
                padding: 4px 6px;
                gap: 3px;
                grid-template-columns: 1fr 0.6fr 0.6fr 0.5fr 0.5fr 0.4fr 0.6fr;
            }
            #discipline-list .list-item {
                min-width: 500px;
                font-size: 0.55rem;
                padding: 4px 6px;
                gap: 3px;
                grid-template-columns: 1fr 0.6fr 0.6fr 0.5fr 0.5fr 0.4fr 0.6fr;
            }
        }
        /* Rest days */
        .rest-day-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 8px;
        }
        .rest-day-controls label {
            font-size: 0.7rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .rest-day-controls input[type="checkbox"] {
            accent-color: var(--accent);
            width: auto;
        }
        /* Instructor entry */
        .instructor-entry {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .instructor-entry select {
            flex: 1;
            min-width: 120px;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.78rem;
            font-family: Inter, sans-serif;
        }
        .instructor-entry .remove-instructor {
            padding: 4px 8px;
            font-size: 0.65rem;
        }
        /* Grading entry */
        .grading-entry {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .grading-entry input {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            flex: 1;
            min-width: 60px;
        }
        /* Calendar controls */
        .calendar-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-controls .student-selector,
        .calendar-controls .instructor-selector,
        .calendar-controls .week-nav {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .calendar-controls select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.78rem;
            font-family: 'Inter', sans-serif;
            max-width: 200px;
        }
        .calendar-controls select:focus {
            outline: none;
            border-color: var(--accent);
        }
        @media (max-width: 600px) {
            .calendar-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .calendar-controls select {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tournament <span>Manager</span></h1>
        <nav id="main-nav">
            <a href="index.html">Dashboard</a>
            <a href="characters.html">Characters</a>
            <a href="tournaments.html">Tournaments</a>
            <a href="curriculum.html" class="active">Curriculum</a>
        </nav>
        <div class="header-actions">
            <button id="export-json-btn" class="small">Export JSON</button>
            <button id="import-json-btn" class="small">Import JSON</button>
            <button id="export-csv-btn" class="small">Export CSV</button>
            <button id="import-csv-btn" class="small">Import CSV</button>
            <button id="template-csv-btn" class="small">Template CSV</button>
            <input type="file" id="json-file-input" accept=".json" style="display:none" />
            <input type="file" id="csv-file-input" accept=".csv" style="display:none" />
        </div>
    </header>

    <main id="app-container">
        <!-- Content rendered by curriculum-main.js -->
    </main>

    <div id="modal-container" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button class="close-modal" id="modal-close">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/export.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/curriculum/curriculum-main.js"></script>
    <script src="js/curriculum/disciplines.js"></script>
    <script src="js/curriculum/class-view.js"></script>
    <script src="js/curriculum/instructor-calendar.js"></script>
    <script src="js/curriculum/grades.js"></script>
    <script src="js/curriculum/ranking.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var checkData = setInterval(function() {
                if (typeof data !== 'undefined' && data) {
                    clearInterval(checkData);
                    var container = document.getElementById('app-container');
                    if (container && typeof renderCurriculumView === 'function') {
                        renderCurriculumView(container);
                    }
                }
            }, 200);
        });
    </script>
</body>
</html>
